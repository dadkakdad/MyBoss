<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBoss — org charts in the browser</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-stage="empty">
  <header class="ribbon">
    <div class="tabstrip"><span class="tab">Org chart</span></div>
    <div class="ribbon-tab" id="ribbon">
      <div class="cluster needs-pick">
        <button class="large" id="open-file" type="button"><img src="icons/icon2.png" alt=""><span>Select Excel file</span></button>
        <button class="large" id="open-sample" type="button"><img src="icons/icon2.png" alt=""><span>Sample</span></button>
        <input id="file" type="file" accept=".xls,.xlsx,.xlsm" hidden>
      </div>

      <div class="cluster needs-upload">
        <div class="upload">
          <label>File <input id="file-name" type="text" readonly tabindex="-1"></label>
          <label>Sheet <select id="sheet"></select></label>
          <label class="check"><input id="titles" type="checkbox" checked> Columns have titles</label>
        </div>
        <button class="large" id="import" type="button"><img src="icons/upload.png" alt=""><span>Import data</span></button>
      </div>

      <div class="cluster needs-import">
        <div class="split">
          <button class="large" id="refresh" type="button" title=""><img src="icons/reload.png" alt=""><span>Refresh</span></button>
          <button class="chev" id="refresh-more" type="button" aria-label="More file actions">▾</button>
          <div class="menu" id="menu-refresh">
            <button type="button" id="pick-again"><img src="icons/icon2.png" alt="">Select another file</button>
            <button type="button" id="pick-sheet"><img src="icons/icon2.png" alt="">Select another sheet</button>
          </div>
        </div>
      </div>

      <div class="cluster needs-import">
        <div class="stack">
          <label>Select category <select id="category"></select></label>
          <label>Select employee <select id="employee"></select></label>
        </div>
        <div class="split">
          <button class="large" id="create-main" type="button"><img src="icons/tree_clever0.png" alt=""><span>Create org chart</span></button>
          <div class="menu" id="menu-create">
            <button type="button" id="single"><img src="icons/tree_clever0.png" alt="">Single slide org structure</button>
            <button type="button" id="infinity"><img src="icons/tree_infinity.png" alt="">Full org structure</button>
          </div>
        </div>
      </div>

      <div class="cluster needs-import">
        <div class="stack">
          <label>Element size <select id="size">
            <option>Large</option>
            <option selected>Medium</option>
            <option>Small</option>
            <option>ExtraSmall</option>
          </select></label>
          <label>Tick size, pt. <select id="gap">
            <option>15</option>
            <option>12</option>
            <option selected>10</option>
            <option>7</option>
            <option>5</option>
          </select></label>
          <label class="check"><input id="sticky" type="checkbox" checked> Sticky sizes</label>
        </div>
      </div>

      <div class="cluster needs-import">
        <div class="split">
          <button class="large" id="place-head" type="button"><img src="icons/reg0king.png" alt=""><span>Manager</span></button>
          <button class="chev" id="manager-more" type="button" aria-label="Employee">▾</button>
          <div class="menu" id="menu-manager">
            <button type="button" id="place-one"><img src="icons/reg0.png" alt="">Employee</button>
          </div>
        </div>
        <div class="split">
          <button class="large" id="place-auto" type="button"><img src="icons/regNplus.png" alt=""><span>Direct reports</span></button>
          <button class="chev" id="reports-more" type="button" aria-label="Row layouts">▾</button>
          <div class="menu" id="menu-reports">
            <button type="button" id="place-1"><img src="icons/reg10.png" alt="">1-in-row</button>
            <button type="button" id="place-2"><img src="icons/reg20.png" alt="">2-in-row</button>
            <button type="button" id="place-4"><img src="icons/reg40.png" alt="">4-in-row</button>
          </div>
        </div>
      </div>

      <div class="cluster needs-import icons">
        <button class="large" id="place-tree" type="button"><img src="icons/tree_stupid.png" alt=""><span>Subordinates</span></button>
        <button class="large" id="departments" type="button"><img src="icons/shades.png" alt=""><span>Departments</span></button>
        <button class="large" id="links" type="button"><img src="icons/slideNs.png" alt=""><span>Links</span></button>
        <button class="large" id="add-slide" type="button"><img src="icons/newslide.png" alt=""><span>Slide</span></button>
        <div class="split">
          <button class="large" id="elements-main" type="button"><img src="icons/card.png" alt=""><span>Elements</span></button>
          <div class="menu" id="menu-elements">
            <button type="button" id="add-title"><img src="icons/title.png" alt="">Title</button>
            <button type="button" id="add-shade"><img src="icons/shade.png" alt="">Shade</button>
            <button type="button" id="add-frame"><img src="icons/border.png" alt="">Frame</button>
            <button type="button" id="add-card"><img src="icons/card.png" alt="">Card</button>
            <button type="button" id="add-line"><img src="icons/line.png" alt="">Connector</button>
            <button type="button" id="add-link" disabled><img src="icons/slideN.png" alt="">Link</button>
          </div>
        </div>
      </div>

      <div class="cluster needs-import">
        <button class="large" id="ungroup" type="button" disabled><img src="icons/ungroup.png" alt=""><span>Ungroup</span></button>
        <button class="large" id="group" type="button" disabled><img src="icons/group.png" alt=""><span>Group</span></button>
        <div class="split">
          <button class="large" id="arrange-main" type="button"><img src="icons/alignTop.png" alt=""><span>Arrange</span></button>
          <div class="menu" id="menu-arrange">
            <button type="button" id="dist-h"><img src="icons/distributeHor.png" alt="">Distribute Horizontally</button>
            <button type="button" id="align-top"><img src="icons/alignTop.png" alt="">Align Top</button>
            <button type="button" id="dist-v"><img src="icons/distributeVer.png" alt="">Distribute Vertically</button>
            <button type="button" id="align-left"><img src="icons/alighLeft.png" alt="">Align Left</button>
            <button type="button" id="remove">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="workspace">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="holder" id="holder">
          <div class="slide" id="slide"></div>
        </div>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
      <div class="status">
        <span id="status-left">No workbook yet.</span>
        <span class="export">
          <button class="mini" id="undo" type="button">Undo</button>
          <button class="mini" id="png" type="button">PNG</button>
          <button class="mini" id="pptx" type="button">PowerPoint</button>
          <button class="mini" id="json" type="button">Project</button>
        </span>
        <span class="zoom">
          <button class="mini" id="zoom-out" type="button">−</button>
          <span id="zoom-label">100%</span>
          <button class="mini" id="zoom-in" type="button">+</button>
          <button class="mini" id="zoom-fit" type="button">Fit</button>
        </span>
      </div>
    </div>
    <aside class="inspector" id="inspector">
      <h2>This sheet</h2>
      <div id="sheet-summary"><p>Open the sample, or choose an Excel file that follows the MyBoss template.</p></div>
      <h2>Selected card</h2>
      <dl class="person" id="person"></dl>
      <h2>Checks</h2>
      <div id="issues"></div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>
  <script src="node_modules/pptxgenjs/dist/pptxgen.bundle.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
