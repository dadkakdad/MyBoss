<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBoss — org charts in the browser</title>
  <link rel="stylesheet" href="css/app.css?v=2c34830b">
</head>
<body data-stage="empty">
  <header class="ribbon">
    <div class="ribbon-tab" id="ribbon">
      <div class="cluster needs-pick">
        <button class="large" id="open-file" type="button"><img src="icons/icon2.png" alt=""><span>Select Excel file</span></button>
        <input id="file" type="file" accept=".xls,.xlsx,.xlsm" hidden>
      </div>

      <div class="cluster needs-upload">
        <div class="upload">
          <label><span>File</span><input id="file-name" type="text" readonly tabindex="-1"></label>
          <label><span>Sheet</span><select id="sheet-fix"></select></label>
        </div>
        <button class="large" id="pick-other-file" type="button" title="Choose a different Excel file"><img src="icons/icon2.png" alt=""><span>Other file</span></button>
        <button class="large" id="edit-data-fix" type="button" title="Fix the sheet's rows here, then import it" hidden><img src="icons/edit-data.svg" alt=""><span>Edit data</span></button>
        <div class="import-problem" id="import-problem" role="alert" hidden></div>
      </div>

      <div class="cluster needs-import">
        <div class="split">
          <button class="large" id="refresh" type="button" title=""><img src="icons/reload.png" alt=""><span>Refresh</span></button>
          <button class="chev" id="refresh-more" type="button" aria-label="More file actions"></button>
          <div class="menu" id="menu-refresh">
            <button type="button" id="pick-again"><img src="icons/icon2.png" alt="">Select another file</button>
            <button type="button" id="pick-sheet"><img src="icons/icon2.png" alt="">Select another sheet</button>
          </div>
        </div>
        <button class="large" id="edit-data" type="button" title="Edit the imported sheet without leaving MyBoss"><img src="icons/edit-data.svg" alt=""><span>Edit data</span></button>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import fields">
        <div class="stack people">
          <label><span>Select sheet</span><select id="sheet"></select></label>
          <label><span>Select category</span><select id="category"></select></label>
          <label><span>Select employee</span><select id="employee"></select></label>
        </div>
        <div class="split">
          <button class="large" id="create-main" type="button"><img src="icons/tree_clever0.png" alt=""><span>Create org chart</span></button>
          <div class="menu" id="menu-create">
            <button type="button" id="single"><img src="icons/tree_clever0.png" alt="">Single slide org structure</button>
            <button type="button" id="infinity"><img src="icons/tree_infinity.png" alt="">Full org structure</button>
          </div>
        </div>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <div class="stack sizes">
          <label><span>Element size</span><select id="size">
            <option>Large</option>
            <option selected>Medium</option>
            <option>Small</option>
            <option>ExtraSmall</option>
          </select></label>
          <label><span>Tick size, pt.</span><select id="gap">
            <option>15</option>
            <option>12</option>
            <option selected>10</option>
            <option>7</option>
            <option>5</option>
          </select></label>
          <label class="check"><input id="sticky" type="checkbox" checked> Sticky sizes</label>
        </div>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <div class="split">
          <button class="large" id="place-head" type="button"><img src="icons/reg0king.png" alt=""><span>Manager</span></button>
          <button class="chev" id="manager-more" type="button" aria-label="Employee"></button>
          <div class="menu" id="menu-manager">
            <button type="button" id="place-one"><img src="icons/reg0.png" alt="">Employee</button>
          </div>
        </div>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <div class="split">
          <button class="large" id="place-auto" type="button"><img src="icons/regNplus.png" alt=""><span>Direct reports</span></button>
          <button class="chev" id="reports-more" type="button" aria-label="Row layouts"></button>
          <div class="menu" id="menu-reports">
            <button type="button" id="place-1"><img src="icons/reg10.png" alt="">1-in-row</button>
            <button type="button" id="place-2"><img src="icons/reg20.png" alt="">2-in-row</button>
            <button type="button" id="place-4"><img src="icons/reg40.png" alt="">4-in-row</button>
          </div>
        </div>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="place-tree" type="button"><img src="icons/tree_stupid.png" alt=""><span>Subordinates</span></button>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="departments" type="button"><img src="icons/shades.png" alt=""><span>Departments</span></button>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="links" type="button"><img src="icons/slideNs.png" alt=""><span>Links</span></button>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="cost-centers" type="button" aria-pressed="false" title="Show or hide the green cost-center stamp on every card">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="5" y="4" width="16" height="20" rx="1.5" fill="#001b58"/>
            <rect x="7.5" y="7.5" width="11" height="2" fill="#ffffff"/>
            <rect x="7.5" y="11.5" width="8" height="2" fill="#9db4d8"/>
            <rect x="13" y="16" width="15" height="12" rx="1.5" fill="#00e000" stroke="#0b6b0b" stroke-width="1"/>
            <text x="20.5" y="24.6" text-anchor="middle" font-size="8" font-family="Arial, sans-serif" font-weight="700" fill="#083008">CC</text>
          </svg>
          <span>Cost centers</span>
        </button>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="add-slide" type="button"><img src="icons/newslide.png" alt=""><span>Slide</span></button>
        <div class="split">
          <button class="large" id="elements-main" type="button"><img src="icons/card.png" alt=""><span>Elements</span></button>
          <div class="menu" id="menu-elements">
            <button type="button" id="add-title"><img src="icons/title.png" alt="">Title</button>
            <button type="button" id="add-shade"><img src="icons/shade.png" alt="">Shade</button>
            <button type="button" id="add-frame"><img src="icons/border.png" alt="">Frame</button>
            <button type="button" id="add-card"><img src="icons/card.png" alt="">Card</button>
            <button type="button" id="add-line"><img src="icons/line.png" alt="">Connector</button>
            <button type="button" id="add-link" disabled><img src="icons/slideN.png" alt="">Link</button>
          </div>
        </div>
      </div>

      <div class="sep needs-import" aria-hidden="true"></div>

      <div class="cluster needs-import">
        <button class="large" id="ungroup" type="button" disabled><img src="icons/ungroup.png" alt=""><span>Ungroup</span></button>
        <button class="large" id="group" type="button" disabled><img src="icons/group.png" alt=""><span>Group</span></button>
        <div class="split">
          <button class="large" id="arrange-main" type="button"><img src="icons/alignTop.png" alt=""><span>Arrange</span></button>
          <div class="menu" id="menu-arrange">
            <button type="button" id="dist-h"><img src="icons/distributeHor.png" alt="">Distribute Horizontally</button>
            <button type="button" id="align-top"><img src="icons/alignTop.png" alt="">Align Top</button>
            <button type="button" id="dist-v"><img src="icons/distributeVer.png" alt="">Distribute Vertically</button>
            <button type="button" id="align-left"><img src="icons/alighLeft.png" alt="">Align Left</button>
            <button type="button" id="remove">Delete</button>
          </div>
        </div>
        <button class="large" id="tool-select" type="button" aria-pressed="false" title="Drag a rectangle to select several elements">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="4" y="6" width="16" height="13" fill="rgba(196,85,0,0.14)" stroke="#c45500" stroke-width="1.6" stroke-dasharray="3 2"/>
            <path d="M15 14.5l5.2 9.2 2.1-2.2 4.6 1.2-11.9-8.2z" fill="#001b58"/>
          </svg>
          <span>Select</span>
        </button>
        <button class="large" id="tool-scale" type="button" aria-pressed="false" title="Drag a selected element to scale it. The orange handle on the selection does the same.">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect x="9" y="9" width="14" height="14" fill="#fff" stroke="#001b58" stroke-width="1.6"/>
            <path d="M5 16h5.2M7.2 13.4L4.2 16l3 2.6M21.8 16H27M24.8 13.4L27.8 16l-3 2.6M16 5v5.2M13.4 7.2L16 4.2l2.6 3M16 21.8V27M13.4 24.8L16 27.8l2.6-3" stroke="#c45500" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Scale</span>
        </button>
      </div>
    </div>
  </header>

  <div class="workspace">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="holder" id="holder">
          <div class="scaler" id="scaler">
            <div class="page" id="page"></div>
            <div class="slide" id="slide"></div>
          </div>
        </div>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
      <div class="status">
        <span id="status-left">No workbook yet.</span>
        <span class="export">
          <button class="mini" id="undo" type="button">Undo</button>
          <button class="mini" id="copy-text" type="button" title="Copy the selected shapes, or the whole slide, as Markdown: title, statistics, structure and a data table (Cmd/Ctrl+C)">Copy text</button>
          <button class="mini" id="png" type="button">PNG</button>
          <button class="mini" id="pptx" type="button">PowerPoint</button>
          <button class="mini" id="json" type="button">Project</button>
          <button class="mini" id="account" type="button">Log in</button>
        </span>
        <span class="zoom">
          <button class="mini" id="zoom-out" type="button">−</button>
          <span id="zoom-label">100%</span>
          <button class="mini" id="zoom-in" type="button">+</button>
          <button class="mini" id="zoom-fit" type="button">Fit</button>
        </span>
      </div>
    </div>
  </div>
  <div class="sheet-dialog" id="sheet-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-panel">
      <header class="sheet-head">
        <h2 id="sheet-title">Edit data</h2>
        <span class="sheet-sub" id="sheet-sub"></span>
        <input id="sheet-filter" type="search" placeholder="Filter rows" aria-label="Filter rows">
        <button type="button" id="sheet-add">+ Row</button>
        <button type="button" id="sheet-add-tbh" title="Adds a row whose surname starts with TBH_">+ Vacancy</button>
        <span class="sheet-sort" role="group" aria-label="Sort rows">
          <label for="sheet-sort-col">Sort by</label>
          <select id="sheet-sort-col"></select>
          <button type="button" id="sheet-sort-asc" title="Ascending, A to Z">▲ A–Z</button>
          <button type="button" id="sheet-sort-desc" title="Descending, Z to A">▼ Z–A</button>
          <button type="button" id="sheet-sort-reset" title="Back to the order in the sheet">Original order</button>
        </span>
        <span class="spacer"></span>
        <button type="button" id="sheet-download">Download .xlsx</button>
      </header>
      <div class="sheet-grid-wrap" id="sheet-wrap"><table class="sheet-grid" id="sheet-grid"></table></div>
      <div class="sheet-issues" id="sheet-issues" aria-live="polite"></div>
      <footer class="sheet-foot">
        <span class="sheet-hint">Key / Intern / Hide / Newcomer: tick the box. Vacancy: surname starts with <b>TBH_</b>. Newcomer date: 16.11.2026 shows as 16.11 on the badge. Enter moves down.</span>
        <span class="spacer"></span>
        <button type="button" id="sheet-cancel">Cancel</button>
        <button type="button" id="sheet-apply" class="primary">Apply to chart</button>
      </footer>
    </div>
  </div>
  <div class="sheet-dialog account-dialog" id="account-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="account-title">
    <div class="sheet-panel account-panel">
      <header class="sheet-head">
        <h2 id="account-title">Account</h2>
        <span class="spacer"></span>
        <button type="button" id="account-close">Close</button>
      </header>
      <form id="account-form">
        <label>Email <input id="account-email" type="email" autocomplete="username" required></label>
        <label>Password <input id="account-password" type="password" autocomplete="current-password" required minlength="8"></label>
        <div class="account-actions">
          <button type="submit">Log in</button>
          <button type="button" id="account-register">Create account</button>
        </div>
        <p class="account-note">Your email and a password. Imported workbooks and slides stay on this account.</p>
      </form>
      <div id="account-home" hidden>
        <p id="account-who"></p>
        <button type="button" id="account-logout">Log out</button>
        <h3>Saved files</h3>
        <ul id="account-files"></ul>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="node_modules/xlsx/dist/xlsx.full.min.js?v=7f749f81"></script>
  <script src="node_modules/pptxgenjs/dist/pptxgen.bundle.js?v=8b9b814f"></script>
  <script src="app.bundle.js?v=f7fad59b"></script>
</body>
</html>
