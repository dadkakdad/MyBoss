<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBoss — org charts in the browser</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="ribbon">
    <div class="brand">
      <strong>MyBoss</strong>
      <span>Org charts from the Excel template, drawn in the browser.</span>
    </div>
    <div class="groups">
      <figure class="group">
        <div class="group-body">
          <button class="tool" id="open-sample" type="button"><img src="icons/icon2.png" alt=""><b>Sample</b></button>
          <button class="tool" id="open-file" type="button"><img src="icons/icon2.png" alt=""><b>Excel</b></button>
          <input id="file" type="file" accept=".xlsx,.xls,.xlsm" hidden>
          <div class="stack">
            <label>Sheet <select id="sheet"></select></label>
            <label class="check"><input id="titles" type="checkbox" checked> Columns have titles</label>
          </div>
          <button class="tool" id="import" type="button"><img src="icons/upload.png" alt=""><b>Import</b></button>
        </div>
        <figcaption>Data</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <div class="stack">
            <label>Category <select id="category"></select></label>
            <label>Employee <select id="employee"></select></label>
          </div>
          <button class="tool-wide" id="single" type="button"><img src="icons/tree_clever0.png" alt=""><b>Single slide</b></button>
          <button class="tool-wide" id="infinity" type="button"><img src="icons/tree_infinity.png" alt=""><b>Full structure</b></button>
        </div>
        <figcaption>Create</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <button class="tool" id="place-head" type="button"><img src="icons/reg0king.png" alt=""><b>Manager</b></button>
          <button class="tool" id="place-one" type="button"><img src="icons/reg0.png" alt=""><b>Employee</b></button>
          <button class="tool" id="place-auto" type="button"><img src="icons/regNplus.png" alt=""><b>Direct reports</b></button>
          <button class="tool" id="place-1" type="button"><img src="icons/reg10.png" alt=""><b>1-in-row</b></button>
          <button class="tool" id="place-2" type="button"><img src="icons/reg20.png" alt=""><b>2-in-row</b></button>
          <button class="tool" id="place-4" type="button"><img src="icons/reg40.png" alt=""><b>4-in-row</b></button>
          <button class="tool" id="place-tree" type="button"><img src="icons/tree_stupid.png" alt=""><b>Subordinates</b></button>
        </div>
        <figcaption>Place</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <div class="stack">
            <label>Element <select id="size">
              <option>ExtraSmall</option>
              <option>Small</option>
              <option selected>Medium</option>
              <option>Large</option>
            </select></label>
            <label>Tick, pt <select id="gap">
              <option>15</option>
              <option>12</option>
              <option selected>10</option>
              <option>7</option>
              <option>5</option>
            </select></label>
            <label class="check"><input id="sticky" type="checkbox" checked> Sticky sizes</label>
          </div>
        </div>
        <figcaption>Size</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <button class="tool" id="add-slide" type="button"><img src="icons/newslide.png" alt=""><b>Slide</b></button>
          <button class="tool" id="add-title" type="button"><img src="icons/title.png" alt=""><b>Title</b></button>
          <button class="tool" id="add-shade" type="button"><img src="icons/shade.png" alt=""><b>Shade</b></button>
          <button class="tool" id="add-frame" type="button"><img src="icons/border.png" alt=""><b>Frame</b></button>
          <button class="tool" id="add-card" type="button"><img src="icons/card.png" alt=""><b>Card</b></button>
          <button class="tool" id="add-line" type="button"><img src="icons/line.png" alt=""><b>Connector</b></button>
          <button class="tool" id="departments" type="button"><img src="icons/shades.png" alt=""><b>Departments</b></button>
          <button class="tool" id="links" type="button"><img src="icons/slideNs.png" alt=""><b>Links</b></button>
        </div>
        <figcaption>Draw</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <button class="tool" id="group" type="button"><img src="icons/group.png" alt=""><b>Group</b></button>
          <button class="tool" id="ungroup" type="button"><img src="icons/ungroup.png" alt=""><b>Ungroup</b></button>
          <button class="tool" id="align-left" type="button"><img src="icons/alighLeft.png" alt=""><b>Align left</b></button>
          <button class="tool" id="align-top" type="button"><img src="icons/alignTop.png" alt=""><b>Align top</b></button>
          <button class="tool" id="dist-h" type="button"><img src="icons/distributeHor.png" alt=""><b>Distribute</b></button>
          <button class="tool" id="dist-v" type="button"><img src="icons/distributeVer.png" alt=""><b>Distribute</b></button>
          <button class="tool" id="undo" type="button"><b>Undo</b><small>Ctrl Z</small></button>
          <button class="tool" id="remove" type="button"><b>Delete</b><small>Selected</small></button>
        </div>
        <figcaption>Arrange</figcaption>
      </figure>

      <figure class="group">
        <div class="group-body">
          <button class="tool" id="png" type="button"><b>PNG</b><small>This slide</small></button>
          <button class="tool" id="pptx" type="button"><b>PowerPoint</b><small>Whole deck</small></button>
          <button class="tool" id="json" type="button"><b>Project</b><small>JSON</small></button>
        </div>
        <figcaption>Export</figcaption>
      </figure>
    </div>
  </header>

  <div class="workspace">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <div class="holder" id="holder">
          <div class="slide" id="slide"></div>
        </div>
      </div>
      <div class="filmstrip" id="filmstrip"></div>
      <div class="status">
        <span id="status-left">No workbook yet.</span>
        <span class="zoom">
          <button class="mini" id="zoom-out" type="button">−</button>
          <span id="zoom-label">100%</span>
          <button class="mini" id="zoom-in" type="button">+</button>
          <button class="mini" id="zoom-fit" type="button">Fit</button>
        </span>
      </div>
    </div>
    <aside class="inspector" id="inspector">
      <h2>This sheet</h2>
      <div id="sheet-summary"><p>Open the sample, or choose an Excel file that follows the MyBoss template.</p></div>
      <h2>Selected card</h2>
      <dl class="person" id="person"></dl>
      <h2>Checks</h2>
      <div id="issues"></div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="node_modules/xlsx/dist/xlsx.full.min.js"></script>
  <script src="node_modules/pptxgenjs/dist/pptxgen.bundle.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
